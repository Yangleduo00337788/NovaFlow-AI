name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        run: mvn -B -q clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: novaflow-web/package-lock.json

      - name: Frontend build
        working-directory: novaflow-web
        run: |
          npm ci
          npm run build

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: novaflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/novaflow?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      NOVAFLOW_CRYPTO_KEY: NovaFlowAI-DevKey-32bytes!!!!
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      LOGIN_RATE_LIMIT_PER_MINUTE: 10000

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install modules without tests
        run: mvn -B -pl novaflow-server -am install -DskipTests

      - name: Run local integration tests
        run: |
          mvn -B -pl novaflow-server test \
            -Plocal-integration \
            -Dgroups=local \
            -Dsurefire.excludedGroups=__none__ \
            -Dtest='*LocalIntegrationTest'

      - name: Print integration test reports on failure
        if: failure()
        run: |
          echo '===== surefire reports ====='
          ls -la novaflow-server/target/surefire-reports || true
          for f in novaflow-server/target/surefire-reports/*.txt; do
            echo "----- $f -----"
            cat "$f" || true
          done

      - name: Upload integration test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            novaflow-server/target/surefire-reports/*.xml
            novaflow-server/target/surefire-reports/*.txt
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: novaflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/novaflow?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      NOVAFLOW_CRYPTO_KEY: NovaFlowAI-DevKey-32bytes!!!!
      CORS_ALLOWED_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build server jar
        run: mvn -B -q -pl novaflow-server -am package -DskipTests

      - name: Start NovaFlow server
        run: |
          nohup java -jar novaflow-server/target/novaflow-server-*.jar > /tmp/novaflow-server.log 2>&1 &
          echo $! > /tmp/novaflow-server.pid

      - name: Wait for server health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/api/v1/health >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 5
          done
          echo "Server failed to start"
          tail -n 200 /tmp/novaflow-server.log || true
          exit 1

      - name: Wait for demo accounts
        run: pwsh -NoProfile -Command ". test/scripts/NovaFlow-TestCommon.ps1; Wait-NovaDemoAccounts"
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Verify smoke test tooling
        run: |
          pwsh -NoProfile -Command "
            . test/scripts/NovaFlow-TestCommon.ps1
            Write-Host \"NovaCurlCommand=$script:NovaCurlCommand\"
            \$health = Invoke-NovaApi -Path '/api/v1/health'
            Write-Host \"health http=\$(\$health.http) code=\$(\$health.code)\"
            if (\$health.http -ne 200 -or \$health.code -ne 0) { exit 1 }
          "
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Prepare gate environment
        run: pwsh -NoProfile -Command ". test/scripts/NovaFlow-TestCommon.ps1; Prepare-NovaGateEnvironment"
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Pre-deploy gate smoke
        run: pwsh -NoProfile -File test/pre-deploy-gate.ps1
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: RBAC API acceptance smoke
        run: pwsh -NoProfile -File test/rbac-api-acceptance.ps1
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Global search smoke
        run: pwsh -NoProfile -File test/global-search-smoke.ps1
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Open API acceptance smoke
        run: pwsh -NoProfile -File test/open-api-acceptance.ps1
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-debug
          path: |
            test/ci-core-smoke.log
            test/*-results.json
            test/*-acceptance.log
          if-no-files-found: ignore

      - name: Upload server log on failure
        if: failure()
        run: tail -n 300 /tmp/novaflow-server.log || true

  e2e:
    runs-on: ubuntu-latest
    needs: smoke
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: novaflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/novaflow?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      NOVAFLOW_CRYPTO_KEY: NovaFlowAI-DevKey-32bytes!!!!
      CORS_ALLOWED_ORIGIN: http://127.0.0.1:3000
      NOVAFLOW_API_URL: http://127.0.0.1:8088
      LOGIN_RATE_LIMIT_PER_MINUTE: 10000
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build server jar
        run: mvn -B -q -pl novaflow-server -am package -DskipTests

      - name: Start NovaFlow server
        run: |
          nohup java -jar novaflow-server/target/novaflow-server-*.jar > /tmp/novaflow-server.log 2>&1 &
          echo $! > /tmp/novaflow-server.pid

      - name: Wait for server health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/api/v1/health >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 5
          done
          tail -n 200 /tmp/novaflow-server.log || true
          exit 1

      - name: Wait for demo accounts
        run: pwsh -NoProfile -Command ". test/scripts/NovaFlow-TestCommon.ps1; Wait-NovaDemoAccounts"
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Prepare gate environment
        run: pwsh -NoProfile -Command ". test/scripts/NovaFlow-TestCommon.ps1; Prepare-NovaGateEnvironment"
        env:
          NOVAFLOW_BASE_URL: http://127.0.0.1:8088

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: novaflow-web/package-lock.json

      - name: Install Playwright and run E2E
        working-directory: novaflow-web
        env:
          NOVAFLOW_API_URL: http://127.0.0.1:8088
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Print Playwright failures
        if: failure()
        working-directory: novaflow-web
        run: |
          echo '===== playwright test-results ====='
          find test-results -name 'error-context.md' | head -20 | while read -r f; do
            echo "----- $f -----"
            cat "$f" || true
          done
          find test-results -name 'trace.zip' | head -20 || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: novaflow-web/playwright-report/
          if-no-files-found: ignore

      - name: Upload server log on failure
        if: failure()
        run: tail -n 300 /tmp/novaflow-server.log || true
