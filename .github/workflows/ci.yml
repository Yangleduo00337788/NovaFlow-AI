name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 排除 local（需本机 MySQL/Redis）与 testcontainers（需 Docker 全栈）集成测试
      - name: Build and test
        run: mvn -B -q clean test -Dtest.excludedGroups=local,testcontainers

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: novaflow-web/package-lock.json

      - name: Frontend build
        working-directory: novaflow-web
        run: |
          npm ci
          npm run build
