spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  flyway:
    validate-on-migrate: true

# 与 dev 共用：Token 放请求头 Authorization（勿仅放在 dev profile 文档内）
sa-token:
  token-name: Authorization
  timeout: 86400
  is-read-header: true
  is-read-cookie: false

logging:
  level:
    root: warn
    ai.novaflow: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

novaflow:
  web:
    base-url: ${NOVAFLOW_WEB_BASE_URL:http://localhost:3000}
    print-urls-on-startup: ${NOVAFLOW_PRINT_URLS_ON_STARTUP:true}

  demo:
    enabled: ${NOVAFLOW_DEMO_ENABLED:false}

  auth:
    registration-enabled: ${NOVAFLOW_REGISTRATION_ENABLED:false}

  mcp:
    stdio-enabled: ${NOVAFLOW_MCP_STDIO_ENABLED:false}

  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}
    allow-localhost: ${NOVAFLOW_CORS_ALLOW_LOCALHOST:false}

  conversation:
    retention-enabled: true
    retention-days: 90
