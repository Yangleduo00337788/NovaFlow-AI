spring:
  config:
    activate:
      on-profile: prod

  flyway:
    validate-on-migrate: true

logging:
  level:
    root: warn
    ai.novaflow: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

novaflow:
  web:
    base-url: ${NOVAFLOW_WEB_BASE_URL:http://localhost:3000}
    print-urls-on-startup: ${NOVAFLOW_PRINT_URLS_ON_STARTUP:true}

  demo:
    enabled: ${NOVAFLOW_DEMO_ENABLED:false}

  auth:
    registration-enabled: ${NOVAFLOW_REGISTRATION_ENABLED:false}

  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}
    allow-localhost: ${NOVAFLOW_CORS_ALLOW_LOCALHOST:false}

  conversation:
    retention-enabled: true
    retention-days: 90
