# HTTP 服务端口
server:
  port: 8080

spring:
  application:
    name: novaflow-server
  profiles:
    active: dev

---
# 本地开发环境配置（敏感信息通过环境变量或 .env 文件注入，见仓库根目录 .env.example）
spring:
  config:
    activate:
      on-profile: dev
    import: optional:file:.env[.properties]

  # MySQL：业务数据 + Flyway 迁移
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/novaflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 数据库版本管理，启动时自动执行 db/migration 脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # Redis：Sa-Token 登录态持久化（重启后端不丢登录）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  # 知识库文档上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Flex：下划线字段自动映射驼峰；手写 SQL 统一放在各模块 resources/mapper/ 下
mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Sa-Token 认证：Token 放请求头 Authorization，有效期 24 小时
sa-token:
  token-name: Authorization
  timeout: 86400
  is-read-header: true
  is-read-cookie: false

# Actuator 健康检查：GET /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ai.novaflow: debug

# LiteFlow 工作流引擎（规则由代码动态注册，不依赖 XML/JSON 规则文件）
liteflow:
  enable: true
  print-execution-log: false

# NovaFlow 业务配置
novaflow:
  web:
    base-url: ${NOVAFLOW_WEB_BASE_URL:http://localhost:3000}
    print-urls-on-startup: ${NOVAFLOW_PRINT_URLS_ON_STARTUP:true}

  monitor:
    qdrant-health-url: ${QDRANT_HEALTH_URL:http://localhost:6333/readyz}
    health-timeout-ms: 3000

  security:
    crypto-key: ${NOVAFLOW_SECURITY_CRYPTO_KEY:${NOVAFLOW_CRYPTO_KEY}}

  cors:
    allowed-origins:
      - http://localhost:3000
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

  auth:
    registration-enabled: ${NOVAFLOW_REGISTRATION_ENABLED:true}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:120}
    login-failure-threshold: ${LOGIN_FAILURE_THRESHOLD:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}

  open-api:
    rate-limit-per-minute: ${OPEN_API_RATE_LIMIT_PER_MINUTE:60}
    ip-rate-limit-per-minute: ${OPEN_API_IP_RATE_LIMIT_PER_MINUTE:30}

  conversation:
    retention-enabled: ${CONVERSATION_RETENTION_ENABLED:true}
    retention-days: ${CONVERSATION_RETENTION_DAYS:90}
    retention-cron: ${CONVERSATION_RETENTION_CRON:0 30 3 * * *}

  mcp:
    allowed-commands: ${NOVAFLOW_MCP_ALLOWED_COMMANDS:npx,node,uvx,uv,python,python3}
    node-path: ${NOVAFLOW_NODE_PATH:}

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${NOVAFLOW_STORAGE_ACCESS_KEY:${MINIO_ACCESS_KEY}}
    secret-key: ${NOVAFLOW_STORAGE_SECRET_KEY:${MINIO_SECRET_KEY}}
    bucket: ${MINIO_BUCKET:novaflow}

  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    use-tls: false
    api-key: ${QDRANT_API_KEY:}

  telemetry:
    enabled: ${OTEL_ENABLED:false}
    service-name: novaflow-server
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
    langfuse-public-key: ${LANGFUSE_PUBLIC_KEY:}
    langfuse-secret-key: ${LANGFUSE_SECRET_KEY:}
    langfuse-host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
